# datasets_config.yaml for the SSL runs that read TAIX-Ray from the authors' native-resolution files (chain/newdata224.sh and chain/newdata512_cropsrc.sh pass it as --datasets_config): the seven pretraining sets,
# data_dir and train_list only (all the trainer reads), the same as datasets_config.yaml's but for the TAIXRay entry, whose paths are png_original/ and taix_original_train.csv, written on Sol by
# base/dataset/TAIXRay/taix_unpack_original.sh train, in place of png512/ and taix_train.csv. The dataset keeps its name TAIXRay, so the heads that a checkpoint keys by that name load as they are, and datasets_config.yaml's own
# TAIXRay entry (the 512 px run's records, the TAIX-Ray linear probe, which reads png512/) stays as it is. base/test_newdata.py checks that nothing else differs. Another group member points the two TAIXRay paths at their own copy.
ChestXray14:
  data_dir: /data/jliang12/jpang12/dataset/nih_xray14/images/images
  train_list: dataset/ChestXray14/Xray14_train_official.txt

CheXpert:
  data_dir: /data/jliang12/jpang12/dataset/CheXpert-v1.0
  train_list: dataset/CheXpert/CheXpert_train_official.csv

VinDrCXR:
  data_dir: /data/jliang12/jpang12/dataset/VinDr-CXR/physionet.org/files/vindr-cxr/1.0.0/
  train_list: dataset/VinDrCXR/VinDrCXR_train_pe_global_one.txt

MIMIC:
  data_dir: /data/jliang12/jpang12/dataset/MIMIC_jpeg/physionet.org/files/mimic-cxr-jpg/2.0.0/
  train_list: dataset/MIMIC/mimic-cxr-2.0.0-train.csv

PadChest:
  data_dir: /data/jliang12/jpang12/dataset/PadChest/image_zips/
  train_list: dataset/PadChest/padchest_train.csv

TAIXRay:
  data_dir: /scratch/jdefili4/datasets-new/TAIX-Ray/png_original/
  train_list: /scratch/jdefili4/datasets-new/TAIX-Ray/taix_original_train.csv

ReXGradient:
  data_dir: /scratch/jdefili4/datasets-new/ReXGradient-160K/
  train_list: /scratch/jdefili4/datasets-new/ReXGradient-160K/rexgradient_train.csv
